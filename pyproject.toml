[project]
name = "surge-pricing-engine"
version = "0.1.0"
description = "Real-time ride surge pricing pipeline"
authors = [
    {name = "Tejaswini Keerthi", email = "tejaswinikeerthi25@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cassandra-driver>=3.30.0",
    "fastapi>=0.136.1",
    "holidays>=0.97",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "kafka-python>=2.3.1",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.1",
    "pygeohash>=3.2.2",
    "pyspark==3.5.0",
    "pytz>=2026.2",
    "redis>=7.4.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "uvicorn>=0.47.0",
    "xgboost>=3.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]
