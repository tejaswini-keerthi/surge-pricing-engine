# =============================================================================
# Surge Pricing Engine - Infrastructure
# =============================================================================
# Services:
#   - zookeeper      : Kafka coordinator (port 2181)
#   - kafka          : Message broker (port 9092)
#   - schema-registry: Avro schema storage (port 8081)
#   - cassandra      : Permanent storage (port 9042)
#   - redis          : In-memory cache (port 6379)
#
# Usage:
#   Start all services:  docker compose up -d
#   Stop all services:   docker compose down
#   View logs:           docker compose logs -f
#   Check status:        docker compose ps
# =============================================================================



# =============================================================================
# NETWORKS
# =============================================================================
networks:
  surge_network:
    driver: bridge
    name: surge_network

# =============================================================================
# VOLUMES — persistent storage that survives container restarts
# =============================================================================
volumes:
  cassandra_data:
    name: surge_cassandra_data
  redis_data:
    name: surge_redis_data
  zookeeper_data:
    name: surge_zookeeper_data
  zookeeper_logs:
    name: surge_zookeeper_logs
  kafka_data:
    name: surge_kafka_data

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # ZOOKEEPER — Kafka's coordination service
  # Must start before Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: surge_zookeeper
    hostname: zookeeper
    networks:
      - surge_network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # KAFKA — Message broker
  # Waits for Zookeeper to be healthy before starting
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: surge_kafka
    hostname: kafka
    networks:
      - surge_network
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SCHEMA REGISTRY — Avro schema storage and versioning
  # Waits for Kafka to be healthy before starting
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: surge_schema_registry
    hostname: schema-registry
    networks:
      - surge_network
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # CASSANDRA — Permanent storage for surge results and ML features
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: surge_cassandra
    hostname: cassandra
    networks:
      - surge_network
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SurgePricingCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 128
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # REDIS — In-memory cache for surge prices and ML features
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: surge_redis
    hostname: redis
    networks:
      - surge_network
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


    # ---------------------------------------------------------------------------
  # SPARK — Streaming processor (Linux container, avoids Windows JVM issues)
  # ---------------------------------------------------------------------------
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: surge_spark
    hostname: spark
    networks:
      - surge_network
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_HOST=redis
      - CASSANDRA_HOST=cassandra
    volumes:
      - ./streaming:/app/streaming
      - ./config:/app/config
      - ./ml:/app/ml
      - ./storage:/app/storage
      - ./.env:/app/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped